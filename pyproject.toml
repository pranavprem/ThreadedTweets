[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 88
src = [".", "threadedtweets", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = [
    "threadedtweets",
    "main",
    "replies",
    "tweet_processor",
    "twitter_handler",
]

[tool.ruff.format]
quote-style = "double"
